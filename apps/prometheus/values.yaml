# apps/prometheus/values.yaml

prometheus:
  prometheusSpec:
    # ── Обнаружение во всех пространствах имен ──
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # ── Хранилище ──
    retention: 15d
    retentionSize: "18GB"   # меньше размера PVC (20Gi), чтобы не переполнить диск
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # ── Ресурсы ──
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi

grafana:
  # ИСПРАВЛЕНО: добавлен размер
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080
  # Явно укажите пароль или используйте existingSecret
  adminPassword: "admin"   # ⚠️ измените или удалите — тогда пароль сгенерируется автоматически

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ── Фиксы для kubeadm ──
# ИСПРАВЛЕНО: используются конечные точки с IP-адресом ноды control-plane,
# т.к. в актуальных версиях чарта kubeControllerManager/kubeScheduler
# не создают Service автоматически.
kubeControllerManager:
  enabled: true
  endpoints:
    - 192.168.5.87   # ← замените на IP-адрес вашей ноды control-plane

kubeScheduler:
  enabled: true
  endpoints:
    - 192.168.5.87   # ← замените на IP-адрес вашей управляющей ноды

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.5.87
  # Если etcd с TLS — понадобятся serviceMonitor.secure и tlsConfig

# Kubelet: включить cAdvisor (по умолчанию уже true, но фиксируем явно)
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    kubelet: true
