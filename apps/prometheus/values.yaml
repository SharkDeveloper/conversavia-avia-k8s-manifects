# apps/prometheus/values.yaml

prometheus:
  prometheusSpec:
    # ── Обнаружение во всех namespace ──
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # ── Хранилище ──
    retention: 15d
    retentionSize: "40GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # ── Ресурсы (под ваш кластер) ──
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi

grafana:
  # ИСПРАВЛЕНО: добавлен size
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080
  # Явно задайте пароль или используйте existingSecret
  adminPassword: "admin"   # ⚠️ смените, или уберите — тогда сгенерируется авто

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ── Фиксы для kubeadm ──
# ИСПРАВЛЕНО: используются endpoints с IP control-plane ноды,
# т.к. в актуальных версиях чарта kubeControllerManager/kubeScheduler
# не создают Service автоматически.
kubeControllerManager:
  enabled: true
  endpoints:
    - 192.168.5.87    # ← замените на IP вашей control-plane ноды

kubeScheduler:
  enabled: true
  endpoints:
    - 192.168.5.87    # ← замените на IP вашей control-plane ноды

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.5.87
  # Если etcd с TLS — понадобятся serviceMonitor.secure и tlsConfig

# Kubelet: включить cAdvisor (по умолчанию уже true, но фиксируем явно)
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    kubelet: true
