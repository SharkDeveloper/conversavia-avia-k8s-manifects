# values.yaml

# --- Ingress не нужен, отключаем ---
ingress:
  enabled: true
  className: nginx          # ← новый способ, работает с nginx-ingress ≥ 1.0
  hosts:
    - host: 192.168.5.87  # ← или ваш реальный домен/поддомен
      paths:
        - path: /
          pathType: Prefix
# --- Ресурсы Parent-пода ---
parent:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# --- Ресурсы Child-подов (DaemonSet) ---
child:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- Хранение данных ---
# Укажите ваш StorageClass, если он не 'default'
database:
  volumesize: 10Gi
#   storageclass: 'your-single-zone-storage-class'
