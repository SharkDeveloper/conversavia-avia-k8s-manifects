# values.yaml

# --- Ingress не нужен, отключаем ---
ingress:
  enabled: false

# --- Ресурсы Parent-пода ---
parent:
  service:
    type: NodePort
    nodePort: 30199
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# --- Ресурсы Child-подов (DaemonSet) ---
child:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- Хранение данных ---
# Укажите ваш StorageClass, если он не 'default'
database:
  volumesize: 10Gi
#   storageclass: 'your-single-zone-storage-class'
