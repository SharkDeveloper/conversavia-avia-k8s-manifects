apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-to-bitrix
  namespace: paperless-ngx
spec:
  schedule: "30 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: convers-avia-k8s-node
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              command: ["/bin/sh","-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y-%m-%d-%H%M%S)
                  echo "$TS" > /work/TS
                  PGPASSWORD="$PGPASSWORD" pg_dump \
                    -h paperless-postgresql -U paperless -d paperless \
                    -Fc -f "/work/Paperless-db-$TS.pgcustom"
              env:
                - name: PGPASSWORD
                  value: "paperless"
                - name: TZ
                  value: "Europe/Moscow"
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: backup
              image: rclone/rclone:latest
              command: ["/bin/sh","-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(cat /work/TS)
                  DEST="bitrix-chunked:"
                  echo "=== Start $(date) TS=$TS ==="

                  # data (небольшой) — целиком
                  tar czf "/work/Paperless-data-$TS.tar.gz" -C /storage data

                  # media (большой): tar → split → rm исходного
                  # BusyBox split не умеет -d и не читает '-', поэтому только так
                  tar czf "/work/Paperless-media-$TS.tar.gz" -C /media .
                  split -b 500M -a 3 \
                    "/work/Paperless-media-$TS.tar.gz" \
                    "/work/Paperless-media-$TS.tar.gz.part-"
                  rm -f "/work/Paperless-media-$TS.tar.gz"

                  # загружаем всё, что относится к текущему TS
                  for f in /work/Paperless-*"$TS"*; do
                    rclone copy "$f" "$DEST/" --config /config/rclone/rclone.conf -v
                  done

                  # ротация: удаляем старше 7 дней
                  rclone delete "$DEST/" \
                    --include "Paperless-*" \
                    --min-age 7d \
                    --config /config/rclone/rclone.conf -v

                  rm -rf /work/*
                  echo "=== Done $(date) ==="
              env:
                - name: RCLONE_CONFIG
                  value: /config/rclone/rclone.conf
                - name: TZ
                  value: "Europe/Moscow"
              volumeMounts:
                - { name: media,         mountPath: /media,          readOnly: true }
                - { name: storage,       mountPath: /storage,        readOnly: true }
                - { name: work,          mountPath: /work }
                - { name: rclone-config, mountPath: /config/rclone,  readOnly: true }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits:   { cpu: 2000m, memory: 2Gi }
          volumes:
            - name: media
              persistentVolumeClaim: { claimName: paperless-ngx-media }
            - name: storage
              persistentVolumeClaim: { claimName: paperless-ngx-storage }
            - name: work
              emptyDir: { sizeLimit: 40Gi }
            - name: rclone-config
              secret: { secretName: rclone-config }
