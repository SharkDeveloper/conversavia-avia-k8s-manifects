# apps/paperless-ngx/values.yaml

image:
  repository: ghcr.io/sharkdeveloper/conversavia-avia-k8s-manifects/paperless-ngx-rus
  tag: "latest"
  pullPolicy: Always

env:
  - name: PAPERLESS_URL
    value: "http://192.168.5.87:31791"
  - name: PAPERLESS_TIME_ZONE
    value: "Europe/Moscow"
  - name: PAPERLESS_OCR_LANGUAGE
    value: "eng+rus"

  - name: PAPERLESS_REDIS
    value: "redis://paperless-redis:6379"

  - name: PAPERLESS_DBHOST
    value: "paperless-postgresql"
  - name: PAPERLESS_DBPORT
    value: "5432"
  - name: PAPERLESS_DBNAME
    value: "paperless"
  - name: PAPERLESS_DBUSER
    value: "paperless"
  - name: PAPERLESS_DBPASS
    value: "paperless"

  - name: PAPERLESS_ADMIN_USER
    value: "admin"
  - name: PAPERLESS_ADMIN_PASSWORD
    value: "admin"
  - name: PAPERLESS_ADMIN_MAIL
    value: "admin@example.com"

  - name: PAPERLESS_TIKA_ENABLED
    value: "true"
  - name: PAPERLESS_TIKA_ENDPOINT
    value: "http://paperless-tika:9998"
  - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
    value: "http://paperless-gotenberg:3000"

# --- Ресурсы основного контейнера paperless-ngx ---
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1500m"

# --- Права доступа ---
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# --- Отключаем встроенные зависимости чарта ---
postgresql:
  enabled: false
redis:
  enabled: false

# --- Доступ: NodePort зафиксирован явно ---
service:
  type: NodePort

ports:
  http:
    port: 8000
    nodePort: 31791   # фиксированный порт, чтобы не менялся при пересоздании Service

# --- Основная директория данных приложения (/usr/src/paperless) ---
persistentVolumeClaim:
  create: true
  size: "5Gi"
  storageClassName: "local-path"
  accessMode: "ReadWriteOnce"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    
# --- Медиа (сами документы) — вынесены на отдельный PVC ---
media:
  enabled: true
  type: pvc
  persistentVolumeClaim:
    claimName: paperless-ngx-media  # ← ДОЛЖНО БЫТЬ claimName, а не existingPersistentVolumeClaim

consumption:
  enabled: true
  type: pvc
  persistentVolumeClaim:
    claimName: paperless-ngx-consumption
    
# --- Redis + PostgreSQL + Tika + Gotenberg через extraObjects ---
extraObjects:
  # ---------- APACHE TIKA ----------
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: paperless-tika
      namespace: paperless-ngx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: paperless-tika
      template:
        metadata:
          labels:
            app: paperless-tika
        spec:
          containers:
            - name: tika
              image: apache/tika:3.3.1.0
              ports:
                - containerPort: 9998
              resources:
                requests:
                  memory: "384Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
  - apiVersion: v1
    kind: Service
    metadata:
      name: paperless-tika
      namespace: paperless-ngx
    spec:
      selector:
        app: paperless-tika
      ports:
        - port: 9998
          targetPort: 9998

  # ---------- GOTENBERG ----------
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: paperless-gotenberg
      namespace: paperless-ngx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: paperless-gotenberg
      template:
        metadata:
          labels:
            app: paperless-gotenberg
        spec:
          containers:
            - name: gotenberg
              image: gotenberg/gotenberg:latest
              ports:
                - containerPort: 3000
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "768Mi"
                  cpu: "1000m"
  - apiVersion: v1
    kind: Service
    metadata:
      name: paperless-gotenberg
      namespace: paperless-ngx
    spec:
      selector:
        app: paperless-gotenberg
      ports:
        - port: 3000
          targetPort: 3000

  # ---------- REDIS ----------
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: paperless-redis
      namespace: paperless-ngx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: paperless-redis
      template:
        metadata:
          labels:
            app: paperless-redis
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              ports:
                - containerPort: 6379
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
  - apiVersion: v1
    kind: Service
    metadata:
      name: paperless-redis
      namespace: paperless-ngx
    spec:
      selector:
        app: paperless-redis
      ports:
        - port: 6379
          targetPort: 6379

  # ---------- POSTGRESQL ----------
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: paperless-postgresql-data
      namespace: paperless-ngx
      labels:
        app: paperless-postgresql
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 30Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: paperless-ngx-media
      namespace: paperless-ngx
      labels:
        app: paperless-ngx
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 110Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: paperless-ngx-media
      namespace: paperless-ngx
      labels:
        app: paperless-ngx
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: paperless-postgresql
      namespace: paperless-ngx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: paperless-postgresql
      template:
        metadata:
          labels:
            app: paperless-postgresql
        spec:
          containers:
            - name: postgres
              image: postgres:16-alpine
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRES_DB
                  value: "paperless"
                - name: POSTGRES_USER
                  value: "paperless"
                - name: POSTGRES_PASSWORD
                  value: "paperless"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "768Mi"
                  cpu: "500m"
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-postgresql-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: paperless-postgresql
      namespace: paperless-ngx
    spec:
      selector:
        app: paperless-postgresql
      ports:
        - port: 5432
          targetPort: 5432
