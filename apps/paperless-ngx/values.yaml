image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: "latest" # или конкретная версия

env:
  - name: PAPERLESS_OCR_LANGUAGE
    value: "eng+rus"
  # PAPERLESS_OCR_LANGUAGES не нужен, если ставим через init-контейнер

extraInitContainers:
  - name: install-russian-ocr
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    command:
      - sh
      - -c
      - |
        apt-get update && apt-get install -y tesseract-ocr-rus
        # Копируем traineddata в директорию, откуда Paperless его читает
        cp /usr/share/tesseract-ocr/*/tessdata/rus.traineddata /tmp/ 2>/dev/null || true
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: tessdata
        mountPath: /tmp
