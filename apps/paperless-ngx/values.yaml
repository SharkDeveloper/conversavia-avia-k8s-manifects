# apps/paperless-ngx/values.yaml

# --- Переменные окружения Paperless ---
env:
  - name: PAPERLESS_URL
    value: "http://192.168.5.87:30800"
  - name: PAPERLESS_TIME_ZONE
    value: "Europe/Moscow"
  - name: PAPERLESS_OCR_LANGUAGE
    value: "eng+rus"

  # --- Redis (создаём вручную через extraObjects) ---
  - name: PAPERLESS_REDIS
    value: "redis://paperless-redis:6379"

  # --- PostgreSQL (зависимость чарта, создаётся автоматически) ---
  - name: PAPERLESS_DBHOST
    value: "paperless-ngx-postgresql"
  - name: PAPERLESS_DBPORT
    value: "5432"
  - name: PAPERLESS_DBNAME
    value: "paperless"
  - name: PAPERLESS_DBUSER
    value: "paperless"
  - name: PAPERLESS_DBPASS
    value: "paperless"

  # --- Администратор ---
  - name: PAPERLESS_ADMIN_USER
    value: "admin"
  - name: PAPERLESS_ADMIN_PASSWORD
    value: "admin"
  - name: PAPERLESS_ADMIN_MAIL
    value: "admin@example.com"

  # --- Секретный ключ Django (сгенерирован) ---
  - name: PAPERLESS_SECRET_KEY
    value: "xK9mP2vL8nQ4wR7tY1uI5oA3sD6fG0hJ2kM9bV4cX8zN1pL7qW3eR5tY2uI6oA"

# --- Включаем PostgreSQL (создаётся чартом автоматически) ---
postgresql:
  enabled: true
  auth:
    database: "paperless"
    username: "paperless"
    password: "paperless"

# --- Настройки доступа ---
service:
  type: NodePort
  nodePort: 30800

# --- Хранилище ---
persistence:
  data:
    enabled: true
    volumeClaimSpec:
      resources:
        requests:
          storage: "5Gi"
  media:
    enabled: true
    volumeClaimSpec:
      resources:
        requests:
          storage: "20Gi"

# --- Redis: Deployment + Service через extraObjects ---
extraObjects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: paperless-redis
      namespace: paperless-ngx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: paperless-redis
      template:
        metadata:
          labels:
            app: paperless-redis
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              ports:
                - containerPort: 6379
  - apiVersion: v1
    kind: Service
    metadata:
      name: paperless-redis
      namespace: paperless-ngx
    spec:
      selector:
        app: paperless-redis
      ports:
        - port: 6379
          targetPort: 6379
