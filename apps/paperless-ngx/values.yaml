# apps/paperless-ngx/values.yaml

config:
  paperless_url: "http://192.168.5.87:30800"
  auth:
    existing_secret: "paperless-ngx-secret"
  ocr_languages: ["eng", "rus"]
  time_zone: "Europe/Moscow"

service:
  type: NodePort
  nodePort: 30800

config.ftpd:
  enabled: true
  public_ip: "192.168.5.87"
  service_type: "NodePort"

persistence:
  data:
    enabled: true
    volumeClaimSpec:
      resources:
        requests:
          storage: "5Gi"
  media:
    enabled: true
    volumeClaimSpec:
      resources:
        requests:
          storage: "20Gi"

postgresql:
  enabled: true
  auth:
    database: "paperless"
    username: "paperless"
    password: "paperless"

valkey:
  enabled: true