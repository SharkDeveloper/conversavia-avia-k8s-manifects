apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Источник 1: Helm-чарт
    - repoURL: https://helm.crystalnet.org
      chart: paperless-ngx
      targetRevision: "0.2.14"
      helm:
        valueFiles:
          - $values/apps/paperless-ngx/values.yaml

    # Источник 2: Ваш Git-репозиторий (values.yaml + secret.yaml)
    - repoURL: https://github.com/SharkDeveloper/conversavia-avia-k8s-manifects.git
      targetRevision: HEAD
      ref: values
      # Указываем, что из этого источника нужно применить ещё и "сырые" манифесты
      directory:
        include: "secret.yaml"
        recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless-ngx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
