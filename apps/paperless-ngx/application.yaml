apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1) Helm-чарт
    - repoURL: https://pascaliske.github.io/helm-charts
      chart: paperless
      targetRevision: "7.0.0"
      helm:
        valueFiles:
          - $values/apps/paperless-ngx/values.yaml

    # 2) Git-репозиторий как ref для values.yaml
    - repoURL: https://github.com/SharkDeveloper/conversavia-avia-k8s-manifects.git
      targetRevision: HEAD
      ref: values

    # 3) Папка с plain-манифестами (CronJob)
    - repoURL: https://github.com/SharkDeveloper/conversavia-avia-k8s-manifects.git
      targetRevision: HEAD
      path: apps/paperless-ngx/backup   # ← директория, а не файл
