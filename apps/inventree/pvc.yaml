apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventree-data
  namespace: inventree
  labels:
    app: inventree
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
