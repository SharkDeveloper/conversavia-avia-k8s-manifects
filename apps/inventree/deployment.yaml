apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventree
  namespace: inventree
  labels:
    app.kubernetes.io/instance: inventree
    app.kubernetes.io/name: inventree
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app.kubernetes.io/instance: inventree
      app.kubernetes.io/name: inventree
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: inventree
        app.kubernetes.io/name: inventree
    spec:
      serviceAccountName: inventree
        
      initContainers:
        - name: init
          # ИЗМЕНЕНО: Указан ваш кастомный образ
          image: ghcr.io/sharkdeveloper/rp.store:sha-1c4f6ff
          # РЕКОМЕНДУЕТСЯ: Always гарантирует, что K8s всегда проверит наличие новой сборки по этому тегу
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              invoke migrate && invoke static
          env:
            - name: INVENTREE_SITE_URL
              value: http://rp.store
            - name: INVENTREE_ALLOWED_HOSTS
              value: '*'
            - name: INVENTREE_CORS_ORIGIN_WHITELIST
              value: "http://rp.store, https://rp.store,http://192.168.5.87"
            - name: INVENTREE_CSRF_TRUSTED_ORIGINS
              value: "http://rp.store, https://rp.store,http://192.168.5.87"
            - name: INVENTREE_FRONTEND_SETTINGS
              value: '{"mobile_mode": "allow-always"}'
            - name: INVENTREE_PUBLIC_ACCESS
              value: "True"
            - name: INVENTREE_DB_ENGINE
              value: postgresql
            - name: INVENTREE_DB_HOST
              value: postgres.inventree.svc.cluster.local
            - name: INVENTREE_DB_PORT
              value: "5432"
            - name: INVENTREE_DB_NAME
              value: inventree
            - name: INVENTREE_DB_USER
              value: inventree
            - name: INVENTREE_DB_PASSWORD
              value: postgres
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          volumeMounts:
            - name: inventree-data
              mountPath: /home/inventree/data
      containers:
        - name: inventree
          # ИЗМЕНЕНО: Указан ваш кастомный образ
          image: ghcr.io/sharkdeveloper/rp.store:sha-1c4f6ff
          # РЕКОМЕНДУЕТСЯ: Always для кастомных сборок
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: INVENTREE_SITE_URL
              value: http://rp.store
            - name: INVENTREE_ALLOWED_HOSTS
              value: '*'
            - name: INVENTREE_CORS_ORIGIN_WHITELIST
              value: "http://rp.store, https://rp.store,http://192.168.5.87"
            - name: INVENTREE_CSRF_TRUSTED_ORIGINS
              value: "http://rp.store, https://rp.store,http://192.168.5.87"
            - name: INVENTREE_FRONTEND_SETTINGS
              value: '{"mobile_mode": "allow-always"}'
            - name: INVENTREE_PUBLIC_ACCESS
              value: "True"
            - name: INVENTREE_TRUSTED_ORIGINS
              value: https://rp.store
            - name: INVENTREE_CACHE_ENABLED
              value: "True"
            - name: INVENTREE_PLUGINS_ENABLED
              value: "True"
            - name: INVENTREE_CACHE_HOST
              value: redis.inventree.svc.cluster.local
            - name: INVENTREE_CACHE_PORT
              value: "6379"
            - name: INVENTREE_CACHE_PASSWORD
              value: redis
            - name: INVENTREE_DB_ENGINE
              value: postgresql
            - name: INVENTREE_DB_HOST
              value: postgres.inventree.svc.cluster.local
            - name: INVENTREE_DB_PORT
              value: "5432"
            - name: INVENTREE_DB_NAME
              value: inventree
            - name: INVENTREE_DB_USER
              value: inventree
            - name: INVENTREE_DB_PASSWORD
              value: postgres
          envFrom:
            - secretRef:
                name: inventree-admin-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          volumeMounts:
            - name: inventree-data
              mountPath: /home/inventree/data
              
        - name: inventree-proxy
          # НЕ ИЗМЕНЕНО: Оставляем стандартный nginx
          image: nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: proxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: inventree-data
              mountPath: /var/www
      volumes:
        - name: proxy-conf
          configMap:
            name: nginx-proxy-config
            defaultMode: 420
        - name: inventree-data
          persistentVolumeClaim:
            claimName: inventree-data
