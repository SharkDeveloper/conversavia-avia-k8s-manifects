apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: inventree
data:
  default.conf: |-
    server {
      # Если хост не совпадает, закрываем соединение для предотвращения спуфинга
      listen 80 default_server;
      return 444;
    }

    server {
      listen 80 deferred;
      client_max_body_size 4G;
      server_name rp.store;
      keepalive_timeout 5;
      root /var/www/;

      # 1. ⛔ ЗАПРЕЩАЕМ кэширование HTML-файлов (включая index.html)
      # Это гарантирует, что браузер ВСЕГДА будет скачивать свежий HTML,
      # в котором прописаны актуальные хеши новых JS/CSS файлов.
      location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }

      # 2. 🚀 АГРЕССИВНО КЭШИРУЕМ хешированные статические файлы
      # Поскольку их имена (например, index-BcQKOmOd.js) меняются при каждой сборке,
      # их можно и нужно кэшировать на 1 год. Браузер даже не будет проверять их актуальность.
      location ~* ^/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        alias /var/www/static/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # 3. Резервное правило для остальной статики (если есть файлы без расширений выше)
      location /static/ {
        alias /var/www/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
      }

      # Медиафайлы требуют аутентификации
      location /media/ {
        alias /var/www/media/;
        auth_request /auth;
      }

      location /auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
      }

      location / {
        # Проверяем, существует ли файл. Если нет (например, запрос /web) -> проксируем в Django
        try_files $uri @app;
      }

      location @app {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_cache_bypass $http_upgrade;
        
        # ⛔ ВАЖНО: Запрещаем самому Nginx кэшировать ответы от Django (включая index.html)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
      }

      error_page 500 502 503 504 /500.html;
      location = /500.html {
        root /var/www/;
      }
    }
