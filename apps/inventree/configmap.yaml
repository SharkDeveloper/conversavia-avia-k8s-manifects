apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: inventree
data:
  default.conf: |-
    # Блокируем запросы с неверным Host для предотвращения спуфинга
    server {
      listen 80 default_server;
      return 444;
    }

    server {
      listen 80 deferred;
      client_max_body_size 4G;
      server_name rp.store;
      keepalive_timeout 5;
      root /var/www/;

      # 1. Запрет кэширования HTML-файлов (на случай, если Nginx отдает их напрямую)
      location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }

      # 2. Агрессивное кэширование хешированных статических файлов (JS, CSS, изображения)
      # Имена этих файлов меняются при каждой сборке, поэтому их можно кэшировать на 1 год.
      location ~* ^/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        alias /var/www/static/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # 3. Резервное правило для остальной статики
      location /static/ {
        alias /var/www/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
      }

      # 4. Медиафайлы требуют аутентификации через Django
      location /media/ {
        alias /var/www/media/;
        auth_request /auth;
      }

      location /auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
      }

      # 5. Основной маршрут: если файл не найден, проксируем в Django (SPA fallback)
      location / {
        try_files $uri @app;
      }

      location @app {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # КРИТИЧЕСКИ ВАЖНО: передаем оригинальный протокол от Ingress (https), 
        # чтобы Django генерировал правильные абсолютные ссылки.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
        proxy_redirect off;
        
        # Запрещаем Nginx кэшировать ответы от Django (включая index.html)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
      }

      # Страницы ошибок
      error_page 500 502 503 504 /500.html;
      location = /500.html {
        root /var/www/;
        internal;
      }
    }
