name: Build paperless-ngx with Russian OCR

on:
  # Запуск при изменениях в Dockerfile или values.yaml
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/paperless-ngx/Dockerfile'
      - '.github/workflows/build-paperless-ngx.yml'
  # Возможность запустить вручную из UI GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Имя образа = <владелец>/<репозиторий>/<название образа>
  # Для вас: ghcr.io/sharkdeveloper/conversavia-avia-k8s-manifects/paperless-ngx-rus
  IMAGE_NAME: ${{ github.repository }}/paperless-ngx-rus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # нужно для пуша в ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/paperless-ngx
          file: apps/paperless-ngx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
