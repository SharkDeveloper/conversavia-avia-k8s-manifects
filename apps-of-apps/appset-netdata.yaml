apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: netdata-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - cluster: in-cluster
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'netdata-{{.cluster}}'
      labels:
        app: netdata
        cluster: '{{.cluster}}'
    spec:
      project: default
      sources:                                          # ← sources (мн.ч.)
        - repoURL: https://netdata.github.io/helmchart/
          chart: netdata
          targetRevision: 3.7.160
          helm:
            releaseName: netdata
            valueFiles:
              - $values/apps/netdata/values.yaml         # ← $values
        - repoURL: https://github.com/ВАШ_РЕПО.git       # ← ВАШ репо с values.yaml
          targetRevision: main                            # ← ваша ветка
          ref: values                                     # ← ref: values
      destination:
        server: '{{.server}}'
        namespace: netdata
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
