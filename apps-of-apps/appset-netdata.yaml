apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: netdata-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - cluster: in-cluster
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'netdata-{{.cluster}}'
      labels:
        app: netdata
        cluster: '{{.cluster}}'
    spec:
      project: default
      source:
        repoURL: https://netdata.github.io/helmchart/
        chart: netdata
        targetRevision: 3.7.160
        helm:
          releaseName: netdata
          valueFiles:
              - $values/apps/netdata/values.yaml                                # ← ref: values
      destination:
        server: '{{.server}}'
        namespace: netdata
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
