apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rp.store-paperless-ngx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: paperless-ngx
  template:
    metadata:
      name: "{{ .name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:      
        - repoURL: https://pascaliske.github.io/helm-charts
          chart: paperless
          targetRevision: "7.0.0"
          helm:
            valueFiles:
              - $values/apps/paperless-ngx/values.yaml
        - repoURL: https://github.com/SharkDeveloper/conversavia-avia-k8s-manifects.git
          targetRevision: HEAD
          ref: values         
      destination:
        server: https://kubernetes.default.svc
        namespace: paperless-ngx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m